<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WasteNav – Pasig City SWMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@500;600;700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--page:#d4dfc3;--pane:#eeeeec;--card:#f3f4f1;--bd:#b9d18f;--ink:#3a5b00;--pri:#2f5000;--act:#8fd160;--sel:#e0ecce;--th:#e4edd3;--txt:#4b5a38;--fld:#fff;--btn:#7b9d3f;--red:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1b2314;--pane:#232b1c;--card:#2a3322;--bd:#44552f;--ink:#cfe7a0;--pri:#6f9a1d;--act:#5f8f2a;--sel:#34431f;--th:#334124;--txt:#c2cdb0;--fld:#1d2517;--btn:#6f9a1d;--red:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--page:#1b2314;--pane:#232b1c;--card:#2a3322;--bd:#44552f;--ink:#cfe7a0;--pri:#6f9a1d;--act:#5f8f2a;--sel:#34431f;--th:#334124;--txt:#c2cdb0;--fld:#1d2517;--btn:#6f9a1d;--red:#ff8a7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--txt);font:600 12px/1.45 "Montserrat Alternates",system-ui,sans-serif}.hide{display:none!important}
h1{font:900 34px/1.1 Nunito,system-ui,sans-serif;color:var(--ink)}h2{font:800 17px Nunito,system-ui,sans-serif;color:var(--ink)}b{color:var(--ink)}
input,select{width:100%;height:36px;border:1px solid var(--bd);border-radius:8px;background:var(--fld);color:var(--txt);padding:0 10px;font:inherit;font-size:12px}input:focus,select:focus{outline:2px solid var(--btn)}input.err{border-color:var(--red)}
.btn{height:34px;border-radius:7px;background:var(--pri);color:#fff;padding:0 14px;font:700 12px "Montserrat Alternates",sans-serif;cursor:pointer;white-space:nowrap}.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--bd)}.btn.d{background:var(--red);color:#fff}.btn.s{height:26px;padding:0 8px;font-size:11px}
.msg{color:var(--red);min-height:16px;font-size:11px}.note{font-size:10.5px;opacity:.85}
#auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--pane)}#auth .ph{background:#4a5c25 center/cover}
.lg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center}.lg img{width:280px;max-width:80%;border-radius:50%}
.lg h1{font-size:40px;color:#d1ddbc;-webkit-text-stroke:3px #3a5b00;paint-order:stroke fill}.lg form{width:100%;max-width:400px;display:grid;gap:9px}.lg .btn{height:44px;font-size:15px;background:var(--btn)}.lg p{color:var(--ink);font-size:14px}.terms{color:#7ec44f!important;font-size:13px!important}
#app{display:grid;grid-template-columns:215px 1fr;min-height:100vh}
nav{padding:20px 14px;display:flex;flex-direction:column;gap:9px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{text-align:center;margin-bottom:8px}.brand img{width:76px;height:76px;border-radius:50%;margin:0 auto 6px;background:#fff}.brand b{font:900 20px Nunito,sans-serif;display:block}.brand span{font-size:10px;color:#7ca83e}
nav button.nb{background:var(--pane);border:1px solid var(--bd);border-radius:8px;padding:11px 8px;color:var(--ink);font:700 12px "Montserrat Alternates",sans-serif;cursor:pointer;text-align:center}nav button.on{background:var(--act);color:#1e3300}
nav hr{border:0;border-top:1px solid var(--bd);margin:6px 0}.reg{font-size:10px;margin-top:10px}.reg b{display:block;margin-bottom:2px}
main{background:var(--pane);padding:22px 24px;min-width:0;margin:8px 8px 8px 0;border-radius:12px}
.top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start;margin-bottom:14px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:12px;margin-bottom:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(250px,1fr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:13px;min-width:0}.k{font:900 28px Nunito,sans-serif;color:var(--ink);line-height:1.2}.kl{font-weight:700;color:var(--ink)}
.tw{overflow-x:auto;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:11px}th{background:var(--th);color:var(--ink);text-align:left;padding:8px;font-size:11px}td{padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;vertical-align:middle}tr.sel td{background:var(--sel)}
a[data-a]{cursor:pointer;color:var(--ink);text-decoration:underline}.pg{display:flex;justify-content:space-between;margin-top:8px}.pg a{text-decoration:none;padding:0 3px}.pg a.cur{font-weight:900;text-decoration:underline}
.b{display:inline-block;padding:1px 8px;border-radius:5px;font-size:10px;font-weight:700}.good{background:#cde8a8;color:#2b4a00}.warn{background:#fdecc0;color:#7a5500}.bad{background:#f8d3cd;color:#8e2418}.neu{background:#e2e4de;color:#4b5a38}
.vc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px}.vc img{width:100%;height:96px;object-fit:cover;border-radius:6px;margin-bottom:6px}.vc .t{display:flex;justify-content:space-between;align-items:center}
.ef{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:8px}.ef label{display:block;font-size:10.5px;color:var(--ink);margin-bottom:3px}
.tip{background:#dcebc1;color:#2b4a00;border-radius:8px;padding:9px;font-size:10.5px;margin-top:8px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:8px}.days button{border:1px solid var(--bd);border-radius:8px;padding:8px;background:var(--card);cursor:pointer;color:var(--txt);text-align:left;font:inherit}.days button.on{background:var(--sel);border-color:var(--btn)}
.mp{position:relative;overflow:hidden;border-radius:8px;border:1px solid var(--bd);margin-top:8px;background:#e8e8e2}.mp img{width:100%;transform-origin:center;transition:transform .2s}.mp .z{position:absolute;right:8px;top:8px;display:grid;gap:2px}.mp .z button{width:26px;height:26px;background:#fff;border-radius:5px;font-size:16px;cursor:pointer;color:#333}.mp .cap{position:absolute;left:8px;top:8px;background:#fff;color:#333;border-radius:6px;padding:5px 8px;font-size:10px}
.ft{display:flex;justify-content:space-between;font-size:10px;margin-top:14px;opacity:.8}svg text{fill:var(--txt);font-size:9px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--txt);padding:18px;width:min(380px,92vw);margin:auto}dialog::backdrop{background:rgba(0,0,0,.45)}
@media(max-width:820px){#auth{grid-template-columns:1fr}#auth .ph{display:none}#app{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.brand{width:100%}main{margin:0;border-radius:0;padding:14px}.g21{grid-template-columns:1fr}}
</style></head><body>
